providers = ["node"]

[variables]
NIXPACKS_NODE_VERSION = "20"
NODE_VERSION = "20"

[phases.setup]
nixPkgs = ["nodejs_20", "npm-9_x", "openssl"]

[phases.install]
cmds = ["rm -rf node_modules/.cache && npm ci --include=dev"]

[phases.build]
dependsOn = ["install"]
cmds = ["npm run db:push", "npm run build", "env | grep -E '^(ALTEGIO_|SESSION_SECRET|SUPABASE_SERVICE)' > dist/.env.runtime 2>/dev/null || true"]
cacheDirectories = []

[start]
cmd = "echo '[RUNTIME-ENV-CHECK]' && env | grep -c ALTEGIO || echo 'ALTEGIO_COUNT=0' && env | grep ALTEGIO || echo 'NO_ALTEGIO_VARS' && NODE_ENV=production node dist/index.cjs"
